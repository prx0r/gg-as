primitive_rules:
  ucp_location_search:
    - "Watch for PRs that add Location/Catalog/Cart/Checkout capabilities"
    - "Score when Location search includes serviceability filters"
    - "Score when Location search adds service-area/distance filtering"
  acp_product_feeds:
    - "Watch for new agent-related fields in product feeds"
    - "Score when feeds include freshness/provenance metadata"
    - "Score when feeds add agent-specific attributes"
  webmcp_service:
    - "Watch for serviceability/service-search primitives"
    - "Score when service discovery becomes machine-readable"
    - "Score when service availability becomes structured"
  attribution_tracking:
    - "Watch for attribution/content-retrieval tracking"
    - "Score when agent decisions become traceable"
    - "Score when content citations are recorded"
  price_provenance:
    - "Watch for price-provenance/freshness mechanisms"
    - "Score when price freshness becomes first-class"
    - "Score when price conflict resolution is explicit"
  google_shopify_convergence:
    - "Score heavily when Google + Shopify agree on a primitive"
    - "Look for Location + Catalog alignment"
  meta_independent:
    - "Score heavily when Meta independently implements same primitive"
    - "Look for pricing provenance in ACP"
  independent_implementation:
    - "Score heavily when independent implementation appears"
    - "Look for non-Google/Shopify implementations of same primitives"
  dispatch_optimization:
    - "Watch for field-service scheduling/solver improvements"
    - "Score when dispatch objective functions change"
    - "Score when constraint weights or eligibility rules change"
  recommendation_ranking:
    - "Watch for ranking function changes in retail recommenders"
    - "Score when hard filter vs soft ranking semantics change"
    - "Score when agent-facing catalog instructions change"
  agent_checkout:
    - "Watch for agent checkout capability changes"
    - "Score when authorization or purchase completion flows change"
